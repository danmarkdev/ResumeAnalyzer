<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume Analyzer — AI Feedback</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Crect width='24' height='24' rx='5' fill='%234f46e5'/%3E%3Cpath d='M14 3H7a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5V8.5L14 3Z' stroke='white' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M14 3v5.5h4.5' stroke='white' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M9 13.5h6M9 16.5h6' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="bg-neutral-950 min-h-screen text-neutral-100">

  <header class="border-b border-neutral-800 bg-neutral-900">
    <div class="max-w-4xl mx-auto px-6 py-5 flex items-center gap-3">
      <div class="h-12 w-12 rounded-xl bg-white flex items-center justify-center shrink-0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z" stroke="#171717" stroke-width="2" stroke-linejoin="round"/>
          <path d="M14 2v6h6" stroke="#171717" stroke-width="2" stroke-linejoin="round"/>
          <path d="M9 13h6M9 17h6M9 9h1" stroke="#171717" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Resume Analyzer</h1>
        <p class="text-neutral-400 text-sm mt-0.5">Upload your resume for an ATS-readiness score and structured, actionable feedback.</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8">

    <!-- Upload form -->
    <section id="upload-section" class="bg-neutral-900 rounded-xl border border-neutral-800 p-6 shadow-lg">
      <form id="analyze-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-2 text-neutral-200">Resume file (PDF or DOCX, max 5MB)</label>
          <div id="drop-zone" class="border-2 border-dashed border-neutral-700 rounded-lg p-8 text-center cursor-pointer hover:border-indigo-500 bg-neutral-950/50 transition-colors">
            <input type="file" id="resume-file" name="resume" accept=".pdf,.docx" class="hidden" required />
            <p id="drop-text" class="text-neutral-400">Click to choose a file, or drag it here</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-neutral-200">Target job description <span class="text-neutral-500 font-normal">(optional, improves keyword matching)</span></label>
          <textarea id="job-description" rows="5" placeholder="Paste the job posting here for tailored keyword and fit feedback..." class="w-full rounded-lg border border-neutral-700 bg-neutral-950 text-neutral-100 placeholder-neutral-500 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition-colors">
          Analyze Resume
        </button>
      </form>
    </section>

    <!-- Loading state -->
    <section id="loading-section" class="hidden mt-8 text-center py-12">
      <div class="inline-block h-8 w-8 border-4 border-indigo-900 border-t-indigo-500 rounded-full animate-spin"></div>
      <p class="mt-4 text-neutral-400 text-sm">Extracting text and generating feedback — this can take up to 20 seconds...</p>
    </section>

    <!-- Error state -->
    <section id="error-section" class="hidden mt-6 bg-red-950/50 border border-red-900 text-red-300 rounded-lg p-4 text-sm"></section>

    <!-- Results -->
    <section id="results-section" class="hidden mt-8 space-y-6"></section>

  </main>

  <footer class="border-t border-neutral-800 bg-neutral-900 mt-8">
    <div class="max-w-4xl mx-auto px-6 py-5">
      <p class="text-neutral-500 text-sm">© Danmark Rosalejos</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
