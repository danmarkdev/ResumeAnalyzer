<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume Analyzer — AI Feedback</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <header class="border-b border-slate-200 bg-white">
    <div class="max-w-4xl mx-auto px-6 py-5">
      <h1 class="text-2xl font-bold tracking-tight">Resume Analyzer</h1>
      <p class="text-slate-500 text-sm mt-1">Upload your resume for an ATS-readiness score and structured, actionable feedback.</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8">

    <!-- Upload form -->
    <section id="upload-section" class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
      <form id="analyze-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-2">Resume file (PDF or DOCX, max 5MB)</label>
          <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center cursor-pointer hover:border-indigo-400 transition-colors">
            <input type="file" id="resume-file" name="resume" accept=".pdf,.docx" class="hidden" required />
            <p id="drop-text" class="text-slate-500">Click to choose a file, or drag it here</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Target job description <span class="text-slate-400 font-normal">(optional, improves keyword matching)</span></label>
          <textarea id="job-description" rows="5" placeholder="Paste the job posting here for tailored keyword and fit feedback..." class="w-full rounded-lg border border-slate-300 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition-colors">
          Analyze Resume
        </button>
      </form>
    </section>

    <!-- Loading state -->
    <section id="loading-section" class="hidden mt-8 text-center py-12">
      <div class="inline-block h-8 w-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="mt-4 text-slate-500 text-sm">Extracting text and generating feedback — this can take up to 20 seconds...</p>
    </section>

    <!-- Error state -->
    <section id="error-section" class="hidden mt-6 bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 text-sm"></section>

    <!-- Results -->
    <section id="results-section" class="hidden mt-8 space-y-6"></section>

  </main>

  <script src="script.js"></script>
</body>
</html>
